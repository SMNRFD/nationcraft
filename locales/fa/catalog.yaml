help:
  body: |
    *دستورات*
    /start — منوی اصلی
    /register — ساخت حساب
    /login — ورود
    /logout — خروج (ابطال نشست)
    /play — باز کردن داشبورد بازی
    /cancel — لغو عملیات فعلی
    /language — تغییر زبان
    /resetpassword — تغییر رمز عبور
    /panel — پنل کاربری
    /status — نمایش وضعیت ربات (توکن، API، FSM)

auth:
  register_prompt: "یک رمز عبور انتخاب کنید (حداقل ۸ کاراکتر). با Argon2id هش می‌شود."
  register_prompt_short: "برای ساخت حساب /register را بفرستید، یا اگر حساب دارید /login را بزنید."
  register_success: "خوش آمدید، {username}! توکن ذخیره شد.\n\nبرای انتخاب کشور /play را بزنید."
  welcome_message: |
    🎉 *به NationCraft خوش آمدید!*

    شما اکنون یک فرمانروای ثبت‌شده هستید. راه‌اندازی:

    1. برای باز کردن منوی اصلی /play را بزنید
    2. روی 🌍 کشور بزنید تا ملت خود را انتخاب کنید
    3. مزارع، معادن و کارخانه‌ها بسازید تا اقتصادتان رشد کند
    4. فناوری‌ها را تحقیق کنید تا واحدها و ساختمان‌های جدید باز شوند
    5. واحدهای نظامی آموزش دهید و میهن خود را دفاع کنید
    6. منابع را در بازار با بازیکنان دیگر معامله کنید
    7. ائتلاف بسازید و جنگ کنید

    در هر زمان /help را بزنید تا همه دستورات را ببینید.
    /panel را بزنید تا حساب خود را مدیریت کنید (زبان، رمز عبور، و غیره)

    خوش بگذرد! 🏰
  already_registered: "ℹ️ شما قبلاً ثبت شده‌اید. برای ورود /login را بزنید، یا برای مدیریت حساب /panel را بزنید."
  already_logged_in: "✅ شما قبلاً وارد شده‌اید. برای ورود مجدد ابتدا /logout را بزنید."
  must_login_first: "⚠️ برای استفاده از این دستور ابتدا باید /login کنید."
  login_prompt: "رمز عبور خود را بفرستید."
  login_success: "✅ وارد شدید. برای ادامه /play را بزنید."
  login_failed: "❌ ورود ناموفق: {message}"
  password_too_short: "رمز عبور خیلی کوتاه است. حداقل ۸ کاراکتر."
  password_empty: "رمز عبور نمی‌تواند خالی باشد."
  reset_password_old_prompt: "🔐 لطفاً رمز عبور *فعلی* خود را بفرستید."
  reset_password_new_prompt: "🆕 لطفاً رمز عبور *جدید* خود را بفرستید (حداقل ۸ کاراکتر)."
  password_reset_success: "✅ رمز عبور با موفقیت تغییر کرد! همه نشست‌ها باطل شدند. لطفاً با رمز جدید دوباره /login کنید."

