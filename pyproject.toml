[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nationcraft"
version = "1.0.0"
description = "NationCraft — production-quality plugin-driven Telegram nation simulation game"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "NationCraft Team" }]
keywords = ["telegram", "game", "strategy", "simulation", "nation", "fastapi", "aiogram"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiogram>=3.13",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis[hiredis]>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.12",
    "httpx>=0.28",
    "structlog>=24.4",
    "rich>=13.9",
    "click>=8.1",
    "apscheduler>=3.10",
    "uvloop>=0.21; sys_platform != 'win32'",
    "httptools>=0.6",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "httpx>=0.28",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "aiosqlite>=0.20",
]
loadtest = ["locust>=2.32"]

[project.scripts]
nationcraft = "nationcraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nationcraft"]

[tool.hatch.build.targets.wheel.shared-data]
"README.md" = "share/doc/nationcraft/README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N", "SIM", "ASYNC", "S", "A", "PLC", "PLE"]
ignore = ["S101", "B008", "N818", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=nationcraft --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: marks integration tests",
    "slow: marks slow tests",
]

[tool.coverage.run]
source = ["src/nationcraft"]
omit = ["*/tests/*", "*/alembic/*"]
